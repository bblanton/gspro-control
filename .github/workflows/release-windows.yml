name: Release Windows Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build on Windows and Release
    runs-on: windows-latest
    env:
      GO111MODULE: on
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: |
            ~\go\pkg\mod
            ~\AppData\Local\go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build Windows binary
        shell: bash
        run: |
          set -euo pipefail
          echo "Building gspro-control for Windows x86_64"
          mkdir -p dist
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/gspro-control.exe ./cmd/gspro-control

      - name: Package artifact (zip)
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          zip gspro-control-windows-amd64.zip gspro-control.exe

      - name: Upload artifact to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: gspro-control-windows-amd64
          path: dist/gspro-control-windows-amd64.zip

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            dist/gspro-control-windows-amd64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


